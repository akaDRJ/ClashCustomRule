port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
secret: "123456"
ipv6: false
tun:
  enable: true
  stack: system
  device: utun
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  sniff:
    TLS:
      ports:
        - 443
        - 8443
      override-destination: false
    HTTP:
      ports:
        - 80
        - 8080
        - 8880
      override-destination: false
    QUIC:
      ports:
        - 443
        - 8443
      override-destination: false
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.push.apple.com
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.drj028.com
    - geosite:cn
    - rule-set:cnsite
    - rule-set:fakeipfilter
