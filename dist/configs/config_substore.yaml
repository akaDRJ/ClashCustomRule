port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
secret: "123456"
ipv6: false
tun:
  enable: true
  stack: system
  device: utun
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  sniff:
    TLS:
      ports:
        - 443
        - 8443
      override-destination: false
    HTTP:
      ports:
        - 80
        - 8080
        - 8880
      override-destination: false
    QUIC:
      ports:
        - 443
        - 8443
      override-destination: false
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.push.apple.com
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.drj028.com
    - geosite:cn
    - rule-set:cnsite
    - rule-set:fakeipfilter
  default-nameserver:
    - tls://223.5.5.5
    - tls://223.6.6.6
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  listen: 0.0.0.0:7874
geodata-mode: true
geox-url:
  geoip: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/geoip.dat
  geosite: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/geosite.dat
  mmdb: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/country.mmdb
  asn: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/GeoLite2-ASN.mmdb
proxy-groups:
  - name: 节点选择
    icon: https://gcore.jsdelivr.net/gh/aaANDkk/Qure_Style_SVG@dec37a65d73ea1b558706a446c0798397c2b05c0/icon/svg/common/Proxy.svg
    type: select
    proxies:
      - 自动选择
      - 香港节点
      - 澳门节点
      - 台湾节点
      - 新加坡节点
      - 日本节点
      - 韩国节点
      - 美国节点
      - 加拿大节点
      - 英国节点
      - 澳大利亚节点
      - 德国节点
      - 法国节点
      - 俄罗斯节点
      - 泰国节点
      - 印度节点
      - 马来西亚节点
      - 低倍率节点
      - 手动切换
      - DIRECT
  - name: 低倍率节点
    icon: https://gcore.jsdelivr.net/gh/aaANDkk/Qure_Style_SVG@dec37a65d73ea1b558706a446c0798397c2b05c0/icon/svg/common/Pig.svg
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 20
    lazy: true
    include-all: true
    filter: (?i)0\.[0-5]|低倍率|省流|大流量|实验性
  - name: 手动切换
    icon: https://gcore.jsdelivr.net/gh/aaANDkk/Qure_Style_SVG@dec37a65d73ea1b558706a446c0798397c2b05c0/icon/svg/common/Available.svg
