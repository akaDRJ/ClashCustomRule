port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
mode: rule
log-level: info
external-controller: 0.0.0.0:9090
secret: "123456"
ipv6: false
tun:
  enable: true
  stack: system
  device: utun
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  sniff:
    TLS:
      ports:
        - 443
        - 8443
      override-destination: false
    HTTP:
      ports:
        - 80
        - 8080
        - 8880
      override-destination: false
    QUIC:
      ports:
        - 443
        - 8443
      override-destination: false
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  skip-domain:
    - Mijia Cloud
    - dlg.io.mi.com
    - +.push.apple.com
dns:
  enable: true
  ipv6: false
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.drj028.com
    - rule-set:fakeipfilter
  respect-rules: false
  default-nameserver:
    - tls://223.5.5.5#DIRECT
    - tls://223.6.6.6#DIRECT
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  direct-nameserver:
    - https://dns.alidns.com/dns-query#DIRECT
    - https://doh.pub/dns-query#DIRECT
  direct-nameserver-follow-policy: false
  nameserver:
    - https://1.1.1.1/dns-query#DNS代理
    - https://8.8.8.8/dns-query#DNS代理
  listen: 0.0.0.0:7874
geodata-mode: true
geox-url:
  geoip: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/geoip.dat
  geosite: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/geosite.dat
  mmdb: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/country.mmdb
  asn: https://cdn.jsdelivr.net/gh/appshubcc/bett-rules@release/GeoLite2-ASN.mmdb
proxy-groups:
  - name: 节点选择
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@b16b260625f873266f6a6a9b88710132774997b8/IconSet/Color/Proxy.png
    type: select
    proxies:
      - 自动选择
      - 香港节点
      - 澳门节点
      - 台湾节点
      - 新加坡节点
      - 日本节点
      - 韩国节点
      - 美国节点
      - 加拿大节点
      - 英国节点
      - 澳大利亚节点
      - 德国节点
      - 法国节点
      - 俄罗斯节点
      - 泰国节点
      - 印度节点
      - 马来西亚节点
      - 低倍率节点
      - 手动切换
      - DIRECT
  - name: DNS代理
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@b16b260625f873266f6a6a9b88710132774997b8/IconSet/Color/Server.png
    type: url-test
    include-all: true
    exclude-type: direct|compatible|pass
    proxies:
      - REJECT
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    lazy: false
  - name: 低倍率节点
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@b16b260625f873266f6a6a9b88710132774997b8/IconSet/Color/Pig.png
    type: url-test
    include-all: true
    filter: (?i)0\.[0-5]|低倍率|省流|大流量|实验性
  - name: 手动切换
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@b16b260625f873266f6a6a9b88710132774997b8/IconSet/Color/Static.png
    type: select
    include-all: true
  - name: 自动选择
    icon: https://gcore.jsdelivr.net/gh/Koolson/Qure@b16b260625f873266f6a6a9b88710132774997b8/IconSet/Color/Auto.png
    type: url-test
    include-all: true
    exclude-filter: (?i)家宽|家庭|家庭宽带|商宽|商业宽带|星链|Starlink|落地
